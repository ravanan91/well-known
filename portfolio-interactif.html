<body>

</main>
<script>
const DATA=[
{id:'one-page',title:'Site one-page 3D',eyebrow:'SITE WEB · THREE.JS',image:'/distill/one-page-threejs.png',html:`<h1>Site one-page immersif</h1>\n<p>Une expérience Three.js pensée pour\n  présenter une marque en mouvement.</p>\n<ul>\n  <li>Direction artistique 3D</li>\n  <li>Animation WebGL</li>\n  <li>Parcours one-page</li>\n</ul>`},
{id:'ecommerce',title:'E-commerce 3D',eyebrow:'E-COMMERCE · THREE.JS',image:'/distill/ecommerce-threejs.png',html:`<h1>E-commerce immersif</h1>\n<p>Une fiche produit interactive avec\n  visualisation 3D et conversion.</p>\n<ul>\n  <li>Produit 3D</li>\n  <li>Personnalisation</li>\n  <li>Panier optimisé</li>\n</ul>`},
{id:'assistant',title:'Assistant personnel',eyebrow:'AUTOMATISATION · N8N',image:'/distill/n8n-assistant.png',html:`<h1>Assistant personnel n8n</h1>\n<p>Un flux qui centralise agenda, tâches,\n  recherches et notifications.</p>\n<ul>\n  <li>Assistant IA</li>\n  <li>Agenda & tâches</li>\n  <li>Notifications</li>\n</ul>`},
{id:'social',title:'Publication sociale',eyebrow:'AUTOMATISATION · N8N',image:'/distill/n8n-social.png',html:`<h1>Publication réseaux sociaux</h1>\n<p>Un workflow de création, validation\n  et diffusion multi-plateforme.</p>\n<ul>\n  <li>Contenu assisté par IA</li>\n  <li>Planification</li>\n  <li>Publication sociale</li>\n</ul>`},
{id:'logo',title:'Identité Baqbaq',eyebrow:'IDENTITÉ VISUELLE · LOGO',image:'/distill/baqbaq-logo.png',html:`<h1>Logo Baqbaq</h1>\n<p>Une identité épurée autour d’un coq,\n  entre tradition et modernité.</p>\n<ul>\n  <li>Logo & symbole</li>\n  <li>Palette de marque</li>\n  <li>Déclinaisons</li>\n</ul>`},
{id:'flyer',title:'Flyer Baqbaq',eyebrow:'PRINT · DIRECTION ARTISTIQUE',image:'/distill/baqbaq-flyer.png',html:`<h1>Flyer Baqbaq</h1>\n<p>Un support imprimé chaleureux qui\n  prolonge l’univers de la marque.</p>\n<ul>\n  <li>Mise en page</li>\n  <li>Iconographie</li>\n  <li>Prêt à imprimer</li>\n</ul>`}];
const cardsEl = document.getElementById('cards'), codesEl = document.getElementById('codes');

  cardsEl.insertAdjacentHTML('beforeend', `<div class="card portfolio-card"><img class="portfolio-image" src="${entry.image}" alt="${entry.title}"><div class="portfolio-top"><b>LUXIAD</b><span>${entry.eyebrow}</span></div><div class="portfolio-copy"><h2>${entry.title}</h2></div></div>`);
  const panel = document.createElement('div');
  panel.className = 'code';
  const text = document.createElement('pre');
  text.className = 'htmltxt';
  text.textContent = entry.html;
  panel.append(text);
  codesEl.append(panel);
}
const belt=document.getElementById('belt'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),cards=[...cardsEl.children],codes=[...codesEl.children],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let cw,ch,gap,Lx,off,vel=0,hover=0,last=performance.now(),drag=false,lastX=0,lastT=0,active=-1,sparks=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mod=(n,m)=>((n%m)+m)%m,hash=(a,b,c)=>{let h=(a*374761393+b*668265263+c*2147483647)|0;h=((h^(h>>>13))*1274126177)|0;return ((h^(h>>>16))>>>0)/4294967296};
